<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Theme Toggle Website</h1>

    <p>Choose your favorite theme. Your choice will be saved.</p>

    <div class="card">
        <h2>Welcome!</h2>
        <p>This card changes color with the theme.</p>
    </div>

    <button id="themeButton" onclick="changeTheme()">
        Switch to Dark
    </button>

    <script src="script.js"></script>
</body>
</html>
